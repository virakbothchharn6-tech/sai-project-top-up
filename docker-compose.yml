version: "3.8"

services:
  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: dokokodo_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www/html
    depends_on:
      - app
      - frontend

  # Laravel Application (PHP-FPM)
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dokokodo_app
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_HOST=db
      - DB_DATABASE=dokokodo_db
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    depends_on:
      - db

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: dokokodo_db
    restart: always
    environment:
      MYSQL_DATABASE: dokokodo_db
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Vue.js Development / Production Service (Node.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dokokodo_frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: dokokodo_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  db_data:
